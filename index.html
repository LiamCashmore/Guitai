<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Guitai — Fretboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ============ MASTHEAD ============================== -->
    <header class="masthead">
      <svg class="sunmark" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <defs><clipPath id="sunClip"><circle cx="23" cy="23" r="22" /></clipPath></defs>
        <g clip-path="url(#sunClip)">
          <rect x="0" y="0"  width="46" height="8" fill="var(--band-1)" />
          <rect x="0" y="8"  width="46" height="8" fill="var(--band-2)" />
          <rect x="0" y="16" width="46" height="9" fill="var(--band-3)" />
          <!-- The fourth band follows the stripe, so day mode gets the
               forest green rather than cream on cream. -->
          <rect x="0" y="25" width="46" height="8" fill="var(--stripe-4)" />
          <rect x="0" y="33" width="46" height="7" fill="var(--band-5)" />
          <rect x="0" y="40" width="46" height="6" fill="var(--band-6)" />
        </g>
      </svg>
      <h1>Guitar</h1>
      <p>Scales · Arpeggios · Chords</p>

      <div class="masthead-tools">
        <div class="select select-compact">
          <select id="instrument" aria-label="Instrument"></select>
        </div>

        <!-- Tuning and the pegs live behind this now: they set the
             instrument up, they aren't a way of looking at it. -->
        <button id="setupBtn" class="btn btn-icon-text" type="button"
                aria-expanded="false" title="Tuning and strings">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-dasharray="2.2 3.4" />
          </svg>
          <span>Setup</span>
        </button>

        <button id="themeBtn" class="btn theme-toggle" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path id="themeSunFill" d="M1 8 A7 7 0 0 1 15 8 Z" fill="currentColor" />
          </svg>
          <span id="themeLabel" class="label">Day</span>
        </button>

        <!-- Phone only: folds the choosers away so the neck gets the screen. -->
        <button id="foldBtn" class="btn btn-icon btn-fold" type="button"
                aria-expanded="true" aria-label="Show or hide the choosers">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 6 L8 11 L13 6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ SETUP (folded away) =================== -->
    <section class="panel panel-quiet panel-setup" id="setupPanel" aria-label="Setup" hidden>
      <div class="field">
        <label for="tuning">Tuning</label>
        <div class="cluster">
          <div class="select select-compact"><select id="tuning"></select></div>
          <button id="pegsBtn" class="btn" type="button" title="Tune string by string">Pegs</button>
        </div>
      </div>

      <!-- One peg per string, numbered the way a player counts them:
           6 is the low one, 1 is the high one. -->
      <div class="field wide" id="tuningEdit">
        <label>Strings — 6 low to 1 high</label>
        <div class="cluster" id="pegs"></div>
      </div>
    </section>

    <!-- ============ WHAT IS ON THE BOARD ================= -->
    <section class="panel panel-what" id="whatPanel" aria-label="Choose what to show">
      <!-- Phone only, and first, because it is the question above all the
           others: everything below is a choice about an instrument, and
           the answers change when the instrument does. It used to sit in
           the Setup drawer with the tuning, which is where you go to set
           an instrument UP rather than to pick which one you are looking
           at. ui.js moves the real menu in here; on a desktop the row is
           not drawn and it stays in the masthead. -->
      <div class="what-row what-phone what-instrument" id="instrumentRow"></div>

      <!-- The phone's second line: which of the four displays. On a
           desktop this row is not drawn — the chips below say the same
           thing without opening a menu. -->
      <div class="what-row what-phone what-phone-kind">
        <div class="select select-kind">
          <select id="kind" class="visually-hidden" aria-hidden="true" tabindex="-1">
            <option value="scale">Scales</option>
            <option value="arpeggio">Arpeggios</option>
            <option value="chord">Chords</option>
            <option value="progression">Progressions</option>
          </select>
        </div>
      </div>

      <div class="what-row">
        <!-- Built by ui.js from the menu below, which stays as the one
             place the choice actually lives. -->
        <div class="chips" id="kindChips" role="group" aria-label="Type"></div>

        <!-- Phone: the root sits beside what it is the root of. -->
        <div class="select select-root what-phone">
          <select id="root" class="visually-hidden" aria-hidden="true" tabindex="-1"></select>
        </div>

        <div class="field wide field-material">
          <label for="scale" id="scaleLabel">Scale</label>
          <div class="select"><select id="scale"></select></div>
        </div>
      </div>

      <div class="what-row what-root">
        <span class="row-label">Root</span>
        <div class="chips chips-root" id="rootChips" role="group" aria-label="Root"></div>
      </div>

      <!-- Phone only. Positions and Capo are things you set once and
           then leave alone, so on a small screen they belong with the
           other choices rather than in the strip over the neck, where
           they were spending a third of the one line that strip gets.
           ui.js moves the real buttons in here; on a desktop the row is
           not drawn and they stay where they were. -->
      <div class="what-row what-phone what-hand" id="handRow"></div>

      <div class="field wide" id="progEdit">
        <label for="progInput">Chords</label>
        <input id="progInput" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="Am7 | D7 | Gmaj7   —   or   vi IV I V" />
        <span id="progReadout" class="readout"></span>
      </div>

    </section>

    <!-- ============ THE BOARD ============================ -->
    <section class="panel panel-board" aria-label="Fretboard">
      <div class="board-tools">
        <button id="cagedBtn" class="btn" type="button">Positions</button>
        <div id="cagedNav" class="stepper">
          <button id="prevPos" class="btn btn-icon" type="button"
                  title="Previous position (←)" aria-label="Previous position">‹</button>
          <span id="posLabel" class="readout"></span>
          <button id="nextPos" class="btn btn-icon" type="button"
                  title="Next position (→)" aria-label="Next position">›</button>
        </div>

        <!-- On at the 1st fret, then dragged along the neck. It keeps
             its name in both states and lights up when one is clamped
             on; which fret that is, the bar on the neck already says. -->
        <button id="capoBtn" class="btn" type="button" aria-pressed="false"
                title="Clamp a capo on, then drag it">Capo</button>

        <div class="cluster" id="ghostField">
          <button id="ghostBtn" class="btn" type="button">Ghost tones</button>
        </div>
        <div class="cluster" id="openField">
          <button id="openBtn" class="btn" type="button">Open strings</button>
        </div>
        <!-- Root, third, seventh and nothing else — the grips a guitarist
             comps with. Kept apart from the full shapes on purpose: the
             two are different answers to the same chord, and mixing them
             into one list of four buries both. -->
        <div class="cluster" id="shellField">
          <button id="shellBtn" class="btn" type="button">Shell</button>
        </div>

        <!-- One button, three states: names, degrees, nothing. -->
        <button id="labelsBtn" class="btn btn-labels" type="button">Note names</button>

        <!-- Playing what is on the board belongs with the controls that
             put it there, not in a separate strip underneath. Exactly
             one of these is ever showing: a run has a Play, a grip has a
             Strum. On a phone ui.js lifts whichever it is into the bar. -->
        <div class="cluster" id="runControls">
          <button id="clearPath" class="btn btn-quiet" type="button" title="Clear the run">Clear</button>
          <button id="playBtn" class="btn btn-accent" type="button">Play</button>
        </div>

        <div class="cluster" id="strumField">
          <!-- How fast the strum crosses the strings. An adjustment, not
               an action: set once and left alone, where the button beside
               it is pressed every time. On a phone ui.js moves it to the
               Practice drawer, in with the tempo, and the bar keeps the
               button. The name only shows there — beside the button it
               has one already. -->
          <span class="slider" id="strumSpeed">
            <span class="slider-name">Strum speed</span>
            <input id="spread" type="range" min="0" max="100" step="5" value="60"
                   aria-label="Strum speed"
                   title="Strum speed — right is one sound, left is note by note" />
            <span id="spreadLabel" class="readout"></span>
          </span>
          <button id="strumBtn" class="btn btn-accent" type="button">Play</button>
        </div>
      </div>

      <div class="board-wrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="board-foot">
        <div class="legend">
          <span><span class="swatch" style="background:var(--root)"></span>Root</span>
          <span><span class="swatch" style="background:var(--note)"></span><span id="legendTone">Scale tone</span></span>
          <span id="runLegend" class="legend-run">
            <span><span class="swatch" style="background:var(--path-asc)"></span>Climbing</span>
            <span><span class="swatch" style="background:var(--path-desc)"></span>Falling</span>
          </span>
        </div>

        <!-- What is left down here is what the board is telling you —
             the key to the colours, and what to do next. The controls
             that act on it have gone up to the strip above. -->
        <div class="board-actions">
          <span class="legend-tip" id="legendTip"></span>
          <div class="cluster" id="pathNav">
            <span id="pathLabel" class="readout readout-hint"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PRACTICE ============================= -->
    <section class="panel panel-quiet panel-practice" aria-label="Practice">
      <button id="metroBtn" class="btn" type="button" title="A click at the tempo below">Metronome</button>
      <span class="slider slider-wide">
        <input id="bpm" type="range" min="30" max="400" step="1" value="80"
               aria-label="Tempo" title="Tempo, in beats per minute" />
        <span id="bpmLabel" class="readout">80</span>
      </span>
      <span id="beatReadout" class="readout"></span>

      <!-- Three small choices that were behind a "more" fold. There is
           room for them on the line they belong to, and a fold over
           three buttons costs more taps than it saves. -->
      <div class="practice-extra" id="practiceExtra">
        <div class="select select-compact">
          <select id="meter" aria-label="Time signature" title="Beats to the bar">
            <option value="4">4/4</option>
            <option value="3">3/4</option>
          </select>
        </div>
        <button id="countInBtn" class="btn" type="button"
                title="A bar counted in before it starts">Count-in</button>
        <button id="loopBtn" class="btn" type="button"
                title="Round and round, in four-bar phrases, until you press stop">Loop</button>
      </div>
    </section>

  </div>

  <!-- ============ PHONE: SHEETS AND THE BAR ============= -->
  <!-- Empty on a desktop, and never shown there. On a phone ui.js moves
       the controls above into these three drawers — the same elements,
       still the ones view.js is holding, simply regrouped for a screen
       that can only show one group at a time. Nothing is duplicated:
       there is one Metronome button in this document, and it is the one
       view.js wired up, wherever it happens to be sitting. -->
  <div class="sheets" id="sheets" hidden>
    <section class="sheet" id="sheetView" aria-label="View options" hidden>
      <div class="sheet-head">
        <span class="sheet-title">View</span>
        <button class="sheet-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheetViewBody"></div>
    </section>

    <section class="sheet" id="sheetPractice" aria-label="Practice" hidden>
      <div class="sheet-head">
        <span class="sheet-title">Practice</span>
        <button class="sheet-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheetPracticeBody"></div>
    </section>

    <section class="sheet" id="sheetSetup" aria-label="Setup" hidden>
      <div class="sheet-head">
        <span class="sheet-title">Setup</span>
        <button class="sheet-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheetSetupBody"></div>
    </section>
  </div>

  <!-- The bar the thumb lives on. The wide slot holds whatever playing
       the board means right now — a run's Play, a grip's Strum — which
       are the very buttons the desktop foot holds, moved here. -->
  <nav class="tabbar" id="tabbar" aria-label="Play and panels" hidden>
    <div class="tabbar-primary" id="tabbarPrimary"></div>

    <button id="tabView" class="btn btn-tab" type="button"
            aria-expanded="false" aria-controls="sheetView" title="View options">
      <span aria-hidden="true">Aa</span>
      <span class="visually-hidden">View options</span>
    </button>

    <button id="tabPractice" class="btn btn-tab" type="button"
            aria-expanded="false" aria-controls="sheetPractice" title="Practice">
      <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="7.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M10 5.4 L10 10 L13.2 11.8" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="visually-hidden">Practice</span>
    </button>

    <button id="tabSetup" class="btn btn-tab" type="button"
            aria-expanded="false" aria-controls="sheetSetup" title="Tuning and strings">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-dasharray="2.2 3.4" />
      </svg>
      <span class="visually-hidden">Setup</span>
    </button>
  </nav>

  <script type="module" src="view.js"></script>
  <!-- Chrome only: chips, folds and drawers. It reads and drives the
       controls view.js owns and never touches the board. -->
  <script src="ui.js" defer></script>
</body>
</html>
