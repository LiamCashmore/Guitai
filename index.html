<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fretboard Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Fretboard Visualizer</h1>

  <div class="controls">
    <div class="field">
      <label for="root">Root</label>
      <select id="root"></select>
    </div>
    <div class="field">
      <label for="kind">Type</label>
      <select id="kind">
        <option value="scale">Scales</option>
        <option value="arpeggio">Arpeggios</option>
        <option value="chord">Chords</option>
      </select>
    </div>
    <div class="field">
      <label for="scale" id="scaleLabel">Scale</label>
      <select id="scale"></select>
    </div>
    <div class="field">
      <label for="labels">Labels</label>
      <select id="labels">
        <option value="note">Note names</option>
        <option value="degree">Scale degrees</option>
      </select>
    </div>
    <div class="field">
      <label>Positions</label>
      <button id="cagedBtn" type="button">CAGED</button>
    </div>
    <div id="cagedNav" class="caged-nav">
      <button id="prevPos" type="button" title="Previous shape (←)">←</button>
      <span id="posLabel"></span>
      <button id="nextPos" type="button" title="Next shape (→)">→</button>
    </div>
    <div class="field">
      <label>Run</label>
      <button id="pathBtn" type="button">PATH</button>
    </div>
    <div class="field" id="ghostField">
      <label>Tones</label>
      <button id="ghostBtn" type="button">GHOST</button>
    </div>
    <div class="field" id="openField">
      <label>Strings</label>
      <button id="openBtn" type="button">OPEN</button>
    </div>
    <div class="field" id="strumField">
      <label>Strum</label>
      <div class="strum-row">
        <button id="strumBtn" type="button">PLAY</button>
        <input id="spread" type="range" min="0" max="100" step="5" value="60"
               title="Strum speed — right is one sound, left is note by note" />
        <span id="spreadLabel"></span>
      </div>
    </div>
    <div id="pathNav" class="caged-nav">
      <span id="pathLabel"></span>
      <button id="playBtn" type="button">PLAY</button>
      <span class="bpm">
        <input id="bpm" type="range" min="40" max="200" step="5" value="80"
               title="Tempo" />
        <span id="bpmLabel">80</span>
      </span>
      <button id="clearPath" type="button" title="Clear the run">clear</button>
    </div>
  </div>

  <div class="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:var(--root)"></span>Root</span>
    <span><span class="swatch" style="background:var(--note)"></span>Scale tone</span>
  </div>

  <script type="module" src="view.js"></script>
</body>
</html>
