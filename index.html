<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Guitai — Fretboard</title>
  <!-- ?v= is a cache-buster: bump it whenever you deploy, so a phone
       that has been here before is made to fetch the new file. -->
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app">

    <!-- ============ MASTHEAD ============================== -->
    <header class="masthead">
      <svg class="sunmark" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <defs><clipPath id="sunClip"><circle cx="23" cy="23" r="22" /></clipPath></defs>
        <g clip-path="url(#sunClip)">
          <rect x="0" y="0"  width="46" height="8" fill="var(--band-1)" />
          <rect x="0" y="8"  width="46" height="8" fill="var(--band-2)" />
          <rect x="0" y="16" width="46" height="9" fill="var(--band-3)" />
          <!-- The fourth band follows the stripe, so day mode gets the
               forest green rather than cream on cream. -->
          <rect x="0" y="25" width="46" height="8" fill="var(--stripe-4)" />
          <rect x="0" y="33" width="46" height="7" fill="var(--band-5)" />
          <rect x="0" y="40" width="46" height="6" fill="var(--band-6)" />
        </g>
      </svg>
      <h1>Guitar</h1>
      <p>Scales · Arpeggios · Chords</p>

      <div class="masthead-tools">
        <div class="select select-compact">
          <select id="instrument" aria-label="Instrument"></select>
        </div>

        <!-- Tuning and the pegs live behind this now: they set the
             instrument up, they aren't a way of looking at it. -->
        <button id="setupBtn" class="btn btn-icon-text" type="button"
                aria-expanded="false" title="Tuning and strings">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-dasharray="2.2 3.4" />
          </svg>
          <span>Setup</span>
        </button>

        <button id="themeBtn" class="btn theme-toggle" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path id="themeSunFill" d="M1 8 A7 7 0 0 1 15 8 Z" fill="currentColor" />
          </svg>
          <span id="themeLabel" class="label">Day</span>
        </button>

        <!-- Phone only: folds the choosers away so the neck gets the screen. -->
        <button id="foldBtn" class="btn btn-icon btn-fold" type="button"
                aria-expanded="true" aria-label="Show or hide the choosers">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 6 L8 11 L13 6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ SETUP (folded away) =================== -->
    <section class="panel panel-quiet panel-setup" id="setupPanel" aria-label="Setup" hidden>
      <div class="field">
        <label for="tuning">Tuning</label>
        <div class="cluster">
          <div class="select select-compact"><select id="tuning"></select></div>
          <button id="pegsBtn" class="btn" type="button" title="Tune string by string">Pegs</button>
        </div>
      </div>

      <!-- One peg per string, numbered the way a player counts them:
           6 is the low one, 1 is the high one. -->
      <div class="field wide" id="tuningEdit">
        <label>Strings — 6 low to 1 high</label>
        <div class="cluster" id="pegs"></div>
      </div>
    </section>

    <!-- ============ WHAT IS ON THE BOARD ================= -->
    <section class="panel panel-what" id="whatPanel" aria-label="Choose what to show">
      <div class="what-row">
        <!-- Built by ui.js from the menu below, which stays as the one
             place the choice actually lives. -->
        <div class="chips" id="kindChips" role="group" aria-label="Type"></div>
        <div class="field wide field-material">
          <label for="scale" id="scaleLabel">Scale</label>
          <div class="select"><select id="scale"></select></div>
        </div>
      </div>

      <div class="what-row what-root">
        <span class="row-label">Root</span>
        <div class="chips chips-root" id="rootChips" role="group" aria-label="Root"></div>
      </div>

      <div class="field wide" id="progEdit">
        <label for="progInput">Chords</label>
        <input id="progInput" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="Am7 | D7 | Gmaj7   —   or   vi IV I V" />
        <span id="progReadout" class="readout"></span>
      </div>

      <!-- The real controls. Kept in the DOM, and in view.js's hands;
           the chips above are just a nicer way to reach them. -->
      <select id="kind" class="visually-hidden" aria-hidden="true" tabindex="-1">
        <option value="scale">Scales</option>
        <option value="arpeggio">Arpeggios</option>
        <option value="chord">Chords</option>
        <option value="progression">Progressions</option>
      </select>
      <select id="root" class="visually-hidden" aria-hidden="true" tabindex="-1"></select>
    </section>

    <!-- Phone only: what is on the board, when the choosers are folded. -->
    <button class="fold-summary" id="foldSummary" type="button" hidden></button>

    <!-- ============ THE BOARD ============================ -->
    <section class="panel panel-board" aria-label="Fretboard">
      <div class="board-tools">
        <button id="cagedBtn" class="btn" type="button">Positions</button>
        <div id="cagedNav" class="stepper">
          <button id="prevPos" class="btn btn-icon" type="button"
                  title="Previous position (←)" aria-label="Previous position">‹</button>
          <span id="posLabel" class="readout"></span>
          <button id="nextPos" class="btn btn-icon" type="button"
                  title="Next position (→)" aria-label="Next position">›</button>
        </div>

        <!-- On at the 1st fret, then dragged along the neck. -->
        <button id="capoBtn" class="btn" type="button" title="Clamp a capo on, then drag it">Off</button>

        <div class="cluster" id="ghostField">
          <button id="ghostBtn" class="btn" type="button">Ghost tones</button>
        </div>
        <div class="cluster" id="openField">
          <button id="openBtn" class="btn" type="button">Open strings</button>
        </div>

        <!-- One button, three states: names, degrees, nothing. -->
        <button id="labelsBtn" class="btn btn-labels" type="button">Note names</button>
      </div>

      <!-- The wrapper is a passthrough on a desktop. On a phone the neck
           is stood on end inside it: the SVG is rotated a quarter turn so
           the nut is at the top and the strings run across, and this box
           is given the height that rotation actually occupies. -->
      <div class="board-wrap" id="boardWrap">
        <div class="board-rot" id="boardRot">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>

      <div class="board-foot">
        <div class="legend">
          <span><span class="swatch" style="background:var(--root)"></span>Root</span>
          <span><span class="swatch" style="background:var(--note)"></span><span id="legendTone">Scale tone</span></span>
          <span id="runLegend" class="legend-run">
            <span><span class="swatch" style="background:var(--path-asc)"></span>Climbing</span>
            <span><span class="swatch" style="background:var(--path-desc)"></span>Falling</span>
          </span>
        </div>

        <div class="board-actions">
          <span class="legend-tip" id="legendTip"></span>

          <div class="cluster" id="pathNav">
            <span id="pathLabel" class="readout readout-hint"></span>
            <div id="runControls" class="cluster">
              <button id="clearPath" class="btn btn-quiet" type="button" title="Clear the run">Clear</button>
              <button id="playBtn" class="btn btn-accent" type="button">Play</button>
            </div>
          </div>

          <div class="cluster" id="strumField">
            <span class="slider">
              <input id="spread" type="range" min="0" max="100" step="5" value="60"
                     aria-label="Strum speed"
                     title="Strum speed — right is one sound, left is note by note" />
              <span id="spreadLabel" class="readout"></span>
            </span>
            <button id="strumBtn" class="btn btn-accent" type="button">Strum</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PRACTICE ============================= -->
    <section class="panel panel-quiet panel-practice" aria-label="Practice">
      <button id="metroBtn" class="btn" type="button" title="A click at the tempo below">Metronome</button>
      <span class="slider slider-wide">
        <input id="bpm" type="range" min="30" max="400" step="1" value="80"
               aria-label="Tempo" title="Tempo, in beats per minute" />
        <span id="bpmLabel" class="readout">80</span>
      </span>
      <span id="beatReadout" class="readout"></span>

      <button id="practiceMore" class="btn btn-quiet practice-more-btn" type="button"
              aria-expanded="false">Bar, count-in, loop</button>

      <div class="practice-extra" id="practiceExtra" hidden>
        <div class="select select-compact">
          <select id="meter" aria-label="Time signature" title="Beats to the bar">
            <option value="4">4/4</option>
            <option value="3">3/4</option>
          </select>
        </div>
        <button id="countInBtn" class="btn" type="button"
                title="A bar counted in before it starts">Count-in</button>
        <button id="loopBtn" class="btn" type="button"
                title="Round and round, in four-bar phrases, until you press stop">Loop</button>
      </div>
    </section>

    <!-- ============ PHONE: THE BAR ======================== -->
    <!-- Five things a player reaches for while playing. Everything else
         is one tap behind one of them. Hidden outright on a desktop,
         where all of it is already on screen. -->
    <nav class="tabbar" id="tabbar" aria-label="Tools" hidden>
      <button class="tab tab-play" id="tabPlay" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M4 2.5 L15 9 L4 15.5 Z" fill="currentColor" />
        </svg>
        <span class="tab-name" id="tabPlayName">Play</span>
      </button>

      <button class="tab" id="tabLabels" type="button">
        <span class="tab-glyph">Aa</span>
        <span class="tab-name" id="tabLabelsName">Names</span>
      </button>

      <button class="tab" data-sheet="sheetView" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 2 V16 M6 2 V16 M10 2 V16 M14 2 V16" />
            <path d="M1 6 H17 M1 11 H17" opacity="0.55" />
          </g>
        </svg>
        <span class="tab-name">Neck</span>
      </button>

      <button class="tab" data-sheet="sheetPractice" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M9 5 V9 L12 11" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span class="tab-name">Time</span>
      </button>

      <button class="tab" data-sheet="sheetSetup" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5" />
          <circle cx="9" cy="9" r="6.6" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-dasharray="2.2 3.4" />
        </svg>
        <span class="tab-name">Setup</span>
      </button>
    </nav>

  </div>

  <!-- ============ PHONE: THE SHEETS ======================= -->
  <!-- Empty on purpose: ui.js moves the real panels in and out of these
       as the screen changes size, so there is only ever one of each
       control and view.js keeps hold of every one of them. -->
  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="sheetWhat" hidden aria-label="What is on the neck">
    <header class="sheet-head">
      <h2>On the neck</h2>
      <button class="btn btn-quiet sheet-done" type="button" data-close>Done</button>
    </header>
    <div class="sheet-body" id="bodyWhat"></div>
  </section>

  <section class="sheet" id="sheetView" hidden aria-label="The neck">
    <header class="sheet-head">
      <h2>The neck</h2>
      <button class="btn btn-quiet sheet-done" type="button" data-close>Done</button>
    </header>
    <div class="sheet-body" id="bodyView"></div>
  </section>

  <section class="sheet" id="sheetPractice" hidden aria-label="Practice">
    <header class="sheet-head">
      <h2>Practice</h2>
      <button class="btn btn-quiet sheet-done" type="button" data-close>Done</button>
    </header>
    <div class="sheet-body" id="bodyPractice"></div>
  </section>

  <section class="sheet" id="sheetSetup" hidden aria-label="Setup">
    <header class="sheet-head">
      <h2>Setup</h2>
      <button class="btn btn-quiet sheet-done" type="button" data-close>Done</button>
    </header>
    <div class="sheet-body" id="bodySetup"></div>
  </section>

  <script type="module" src="view.js"></script>
  <!-- Chrome only: chips, folds and drawers. It reads and drives the
       controls view.js owns and never touches the board. -->
  <script src="ui.js?v=3" defer></script>
</body>
</html>
