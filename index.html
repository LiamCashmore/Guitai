<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fretboard Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Fretboard Visualizer</h1>

  <div class="controls">
    <div class="field">
      <label for="root">Root</label>
      <select id="root"></select>
    </div>
    <div class="field">
      <label for="scale">Scale</label>
      <select id="scale"></select>
    </div>
    <div class="field">
      <label for="labels">Labels</label>
      <select id="labels">
        <option value="note">Note names</option>
        <option value="degree">Scale degrees</option>
      </select>
    </div>
    <div class="field">
      <label>Positions</label>
      <button id="cagedBtn" type="button">CAGED</button>
    </div>
    <div id="cagedNav" class="caged-nav">
      <button id="prevPos" type="button" title="Previous shape (←)">←</button>
      <span id="posLabel"></span>
      <button id="nextPos" type="button" title="Next shape (→)">→</button>
    </div>
  </div>

  <div class="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:var(--root)"></span>Root</span>
    <span><span class="swatch" style="background:var(--note)"></span>Scale tone</span>
  </div>

  <script type="module" src="view.js"></script>
</body>
</html>
